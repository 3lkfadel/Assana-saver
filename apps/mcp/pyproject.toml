[project]
name = "infinity-planning-mcp"
version = "0.1.0"
description = "MCP server that lets Claude read and update Infinity Planning through its public API"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastmcp==4.1.0",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "respx>=0.22,<1",
    "ruff>=0.16,<1",
]

[project.scripts]
infinity-planning-mcp = "infinity_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infinity_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

# Infinity Planning on Coolify (Docker Compose build pack, built from this repository).
# Guide: docs/deploiement-coolify.md
#
# One public domain, on the `proxy` service: Coolify's Traefik terminates HTTPS and forwards to
# port 80, where Caddy routes by path to web, admin (/god-mode), space (/spaces), live (/live),
# the API (/api, /auth, /static), the MCP server (/mcp) and the uploads bucket.
# Passwords and secrets are generated by Coolify (SERVICE_PASSWORD_* / SERVICE_USER_*).

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: ${SERVICE_USER_POSTGRES}
  POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
  POSTGRES_DB: plane
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${SERVICE_USER_MINIO}
  AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads
  USE_MINIO: 1
  # 1 when the domain is served over HTTPS (the default on Coolify), 0 for a plain http domain.
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-1}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}

x-app-env: &app-env
  WEB_URL: ${SERVICE_URL_PROXY}
  CORS_ALLOWED_ORIGINS: ${SERVICE_URL_PROXY}
  DEBUG: 0
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@plane-db:5432/plane
  SECRET_KEY: ${SERVICE_PASSWORD_64_SECRETKEY}
  AMQP_URL: amqp://${SERVICE_USER_RABBITMQ}:${SERVICE_PASSWORD_RABBITMQ}@plane-mq:5672/plane
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  LIVE_SERVER_SECRET_KEY: ${SERVICE_PASSWORD_64_LIVESECRET}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

x-backend-build: &backend-build
  context: ./apps/api
  dockerfile: Dockerfile.api

services:
  proxy:
    build:
      context: ./deployments/coolify/proxy
    environment:
      # Coolify routes the domain set on this service to port 80.
      - SERVICE_URL_PROXY_80
      - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-5242880}
      - BUCKET_NAME=uploads
    depends_on:
      - web
      - admin
      - space
      - live
      - api
      - mcp
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
    environment:
      # Static files per minute and per public IP: a whole office often shares one IP.
      STATIC_RATE_LIMIT_EVENTS: ${WEB_STATIC_RATE_LIMIT:-5000}
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
    depends_on:
      - api
    restart: unless-stopped

  space:
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
    depends_on:
      - api
    restart: unless-stopped

  live:
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
    environment:
      <<: *redis-env
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${SERVICE_PASSWORD_64_LIVESECRET}
    depends_on:
      - api
      - plane-redis
    restart: unless-stopped

  api:
    build: *backend-build
    command: ./bin/docker-entrypoint-api.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env]
    volumes:
      - logs_api:/code/plane/logs
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
      - plane-minio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/instances/"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10

  worker:
    build: *backend-build
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env]
    volumes:
      - logs_worker:/code/plane/logs
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    restart: unless-stopped

  beat-worker:
    build: *backend-build
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env]
    volumes:
      - logs_beat_worker:/code/plane/logs
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    restart: unless-stopped

  migrator:
    build: *backend-build
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      <<: [*app-env, *db-env, *redis-env, *aws-s3-env]
    volumes:
      - logs_migrator:/code/plane/logs
    depends_on:
      - plane-db
      - plane-redis
    restart: "no"
    # A one-shot container: its exit must not mark the application unhealthy.
    exclude_from_hc: true

  mcp:
    build:
      context: ./apps/mcp
    environment:
      INFINITY_API_URL: http://api:8000
      INFINITY_WEB_URL: ${SERVICE_URL_PROXY}
      # Slug of the organisation created at first sign-in (shown in its URLs).
      INFINITY_WORKSPACE_SLUG: ${INFINITY_WORKSPACE_SLUG:-infinity-africa-group}
      MCP_PUBLIC_URL: ${SERVICE_URL_PROXY}/mcp
    depends_on:
      - api
    restart: unless-stopped

  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    volumes:
      - redisdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 20s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${SERVICE_USER_RABBITMQ}
      RABBITMQ_DEFAULT_PASS: ${SERVICE_PASSWORD_RABBITMQ}
      RABBITMQ_DEFAULT_VHOST: plane
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3

  plane-minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - uploads:/export
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmq_data:
  uploads:
  logs_api:
  logs_worker:
  logs_beat_worker:
  logs_migrator:
